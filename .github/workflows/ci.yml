# Builds and tests the package through SwiftPM. Apple platform coverage lives in
# apple-platforms.yml, which drives the same manifest through the Xcode build system instead.

name: CI

# Pushes only fire on the branches git-flow keeps around: the two long-lived ones plus the
# release-prep pair. Short-lived feature branches are covered by the pull_request trigger when they
# open against one of these, so listing them here would only run the same commit twice.
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop, "release/**", "hotfix/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 30
    # The toolchain is pinned rather than taken from whatever the image currently defaults to. The
    # manifest declares tools version 6.3, so an image roll moving the default Xcode back would stop
    # the package resolving at all rather than failing partway through a build — and
    # apple-platforms.yml pins this exact Xcode, so leaving this one floating would mean one
    # repository compiling with two toolchains and saying so nowhere. The runner keeps a minor-level
    # symlink at the current patch (Xcode_26.6.app -> Xcode_26.6.1.app), so this survives patch
    # churn.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    strategy:
      fail-fast: false
      # Both configurations, because they are not the same program. Release is what ships and the
      # only one Swift's default cross-module optimization applies to — every call a consumer makes
      # here crosses a module boundary, since the value and the coder are separate targets behind
      # an umbrella that re-exports them. Debug is where the measurement suites compile their
      # `#if DEBUG` half and where `precondition` has an unoptimized program to fire in.
      #
      # No ThreadSanitizer row. Nothing in this package holds mutable state across threads: the
      # value is an enum of value types, and the coder builds one tree per call. The probe in
      # `PropertyListTestSupport` is for a developer who attaches a sanitizer locally, not for a row
      # here.
      matrix:
        include:
          - name: "macOS"
            configuration: release
          - name: "macOS · Debug"
            configuration: debug
    # Verbose output is gated on RUNNER_DEBUG throughout: it is only present when a run has step
    # debug logging enabled — through the ACTIONS_STEP_DEBUG variable or the re-run checkbox — and
    # then holds "1". Ordinary runs stay terse; re-running the same commit in debug mode brings the
    # detail back without editing the workflow. The variable cannot be folded into a job-level env:
    # the runner context is unavailable there.
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version

      # The build step is the library exactly as a consumer gets it. The test step is not:
      # `-enable-testing` publishes the internal symbols of the modules under test, which costs the
      # optimizer some of what it may assume. No test here is `@testable` today — every target is
      # exercised through its public interface — so it is asked for ahead of the first one that
      # needs it, which then compiles without this file having to change first.
      - name: Build
        run: swift build -c ${{ matrix.configuration }} ${RUNNER_DEBUG:+-v}

      # The measurement suites are skipped rather than run. They skip themselves in debug, but a
      # release row would otherwise execute measure blocks that no baseline can fail and nobody
      # reads — and `XCTCPUMetric` wants hardware performance counters that a virtualized runner
      # may not have. Compiling them is the part worth keeping.
      - name: Test
        run: |
          swift test -c ${{ matrix.configuration }} -Xswiftc -enable-testing ${RUNNER_DEBUG:+-v} \
            --skip PerformanceTests

      # The trait set is part of the package's public interface, so every configuration a consumer
      # can ask for has to keep compiling. `Value` is the one the README advertises — a consumer
      # that only reads a property list and wants none of the coder — and disabling both leaves the
      # umbrella with nothing to re-export, which is the configuration that would break first if a
      # target ever imported a sibling unconditionally.
      - name: Build without the coder
        run: swift build -c ${{ matrix.configuration }} --traits Value ${RUNNER_DEBUG:+-v}
      - name: Build without default traits
        run: swift build -c ${{ matrix.configuration }} --disable-default-traits ${RUNNER_DEBUG:+-v}

  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # The toolchain comes from the image rather than from an installer, which pins it without a
    # download step and lets the musl row below pin harder than the others by naming a different
    # tag. A bare minor floats to its newest patch, the same way `swiftly install 6.3` would.
    container: swift:${{ matrix.swift }}
    timeout-minutes: 30
    env:
      SWIFT_SDK: ${{ matrix.swift_sdk }}
    # This job carries more than a portability check. Reading a number out of an `Any` is the one
    # place the two Foundations disagree, and the `#else` half of it — matching `Bool`,
    # `FixedWidthInteger` and `BinaryFloatingPoint` against what
    # `NSNumber._swiftValueOfOptimalType` chose — is compiled nowhere else. So is the `Int64` that
    # `propertyList` narrows away from, which on Darwin bridges to the same `NSNumber` either way
    # and here is a type a caller's `as? Int` would miss.
    strategy:
      fail-fast: false
      # The musl row cross-compiles against the static Linux SDK, which is the other C library the
      # package can land on and the one whose Foundation nobody here builds by accident. The SDK is
      # only compatible with the exact toolchain version that built it, so unlike the floating rows
      # above this one names a patch; the tag, the URL, and the checksum are bumped together.
      matrix:
        include:
          - name: "Linux"
            swift: "6.3"
            configuration: release
          - name: "Linux · Debug"
            swift: "6.3"
            configuration: debug
          - name: "Linux · musl"
            swift: "6.3.3"
            configuration: release
            swift_sdk: x86_64-swift-linux-musl
            static_sdk_url: https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
            static_sdk_checksum: 87c3eaf908e67c0e13a84367119e12273cec1d2cd3d81f7d74bb36722d6b607b
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version

      - name: Install the static Linux SDK
        if: matrix.swift_sdk
        run: swift sdk install "${{ matrix.static_sdk_url }}" --checksum "${{ matrix.static_sdk_checksum }}"

      - name: Build
        run: |
          swift build -c ${{ matrix.configuration }} ${RUNNER_DEBUG:+-v} \
            ${SWIFT_SDK:+--swift-sdk "$SWIFT_SDK"}

      # The musl row stops at the build above: the static Linux SDK ships no testing library —
      # neither swift-testing nor XCTest — so that C library is compiled here and can only be run
      # against where a full toolchain exists.
      #
      # `--skip PerformanceTests` matches nothing on this platform, since both measurement suites
      # are Darwin-only — swift-corelibs-xctest has no `measure(metrics:)` to call. Stated anyway,
      # so the command is the same one the macOS job runs rather than two that drift apart.
      - name: Test
        if: ${{ !matrix.swift_sdk }}
        run: |
          swift test -c ${{ matrix.configuration }} -Xswiftc -enable-testing ${RUNNER_DEBUG:+-v} \
            --skip PerformanceTests

      - name: Build without the coder
        run: |
          swift build -c ${{ matrix.configuration }} --traits Value ${RUNNER_DEBUG:+-v} \
            ${SWIFT_SDK:+--swift-sdk "$SWIFT_SDK"}
      - name: Build without default traits
        run: |
          swift build -c ${{ matrix.configuration }} --disable-default-traits ${RUNNER_DEBUG:+-v} \
            ${SWIFT_SDK:+--swift-sdk "$SWIFT_SDK"}
