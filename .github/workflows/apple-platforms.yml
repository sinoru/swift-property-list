# Builds the package for every Apple platform it declares support for, through the Xcode build
# system, and runs its tests wherever a runner can boot the destination. The Xcode-to-Swift
# mapping, the runner images and the simulator lookup live in sinoru/github-workflows; what is
# here is what is particular to this package.
#
# This is a different axis from swift.yml, not a duplicate of it. `swift build` compiles for the
# host alone, so the five other Apple platforms the manifest claims are never compiled there;
# `xcodebuild` generates its own build graph from the same manifest, which is why macOS appears
# in both workflows on purpose.

name: Apple Platforms

# Pushes only fire on the branches git-flow keeps around: the two long-lived ones plus the
# release-prep pair. Short-lived feature branches are covered by the pull_request trigger when
# they open against develop, so listing them here would only run the same commit twice.
#
# And only for a change that can alter what is built here: the sources, the tests, the manifest
# and what it resolved to, and this file. A commit to the README or the changelog runs nothing.
# A branch filter and a path filter must both be satisfied.
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths: &paths
      - Sources/**
      - Tests/**
      - Package.swift
      - Package.resolved
      - .github/workflows/apple-platforms.yml
  pull_request:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both configurations, every suite in each. Release is the library as a client gets it, and an
  # optimizer may break a narrowing that Debug gets right; nothing here is `@testable`, so the
  # two differ by the optimizer alone.
  #
  # The Swift axis moves the platform SDKs along with the compiler, which is what makes it worth
  # crossing with the platforms rather than sampling one corner. Device and simulator are
  # separate SDKs and separate target triples, so they fail independently; the device rows have
  # nothing to run on and stop after the build. The watchOS device row is the one that matters
  # most: it is the only target where `Int` is 32 bits, and the package narrows against that
  # width in two directions, `propertyList` returning `Int` when the stored `Int64` fits and the
  # coder reading `Int` and `UInt` out of the same two carriers. No runner has a watch, so that
  # branch is compiled here and run nowhere.
  #
  # No older OS runtime is pinned. The package has no `#available` and behaves the same on every
  # release, so an extra runtime would be a multi-gigabyte download that tests nothing new.
  apple-platforms:
    uses: sinoru/github-workflows/.github/workflows/apple-platforms.yml@main
    with:
      scheme: PropertyList
      swift: '["6.3", "6.4"]'
      configurations: '["Debug", "Release"]'
      targets: |
        [
          "arm64-apple-macosx",
          "arm64-apple-ios-macabi",
          "arm64-apple-ios",
          "arm64-apple-ios-simulator",
          "arm64-apple-tvos",
          "arm64-apple-tvos-simulator",
          "arm64_32-apple-watchos",
          "arm64-apple-watchos-simulator",
          "arm64-apple-xros",
          "arm64-apple-xros-simulator"
        ]
