# Builds the package through SwiftPM across the Swift toolchains it claims to support, on every
# target the runners can reach, checks that every trait set a consumer can ask for still
# compiles, and runs the benchmarks on the two hosts the harness runs on. The toolchain setup,
# the matrix and the build steps live in sinoru/github-workflows; what is here is what is
# particular to this package. The Xcode build system takes a different path through the same
# manifest, so Apple platform coverage lives in apple-platforms.yml instead.

name: Swift

# Pushes only fire on the branches git-flow keeps around: the two long-lived ones plus the
# release-prep pair. Short-lived feature branches are covered by the pull_request trigger when
# they open against develop, so listing them here would only run the same commit twice.
#
# And only for a change that can alter what is built here: the sources, the tests, the
# benchmarks, the manifest and what it resolved to, and this file. A commit to the README or
# the changelog runs nothing. A branch filter and a path filter must both be satisfied.
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths: &paths
      - Sources/**
      - Tests/**
      - Benchmarks/**
      - Package.swift
      - Package.resolved
      - .github/workflows/swift.yml
  pull_request:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two minors, every target, both configurations. 6.3 is the floor the manifest declares and
  # 6.4 the newest; nothing in the sources tells them apart, so the second is there for a
  # toolchain change that breaks the package to show as a red job. Release is compiled without
  # testability, so what is tested is what ships; no test here is `@testable`, so the two
  # configurations differ by the optimizer alone, and `precondition` survives `-O`, so the tests
  # that watch one fail run in both.
  #
  # Swift Testing alone, everywhere: no XCTest case is left in the package, and the corelibs
  # runner traps on an empty list rather than reporting none.
  #
  # Away from Darwin the bridge to Foundation's `Any` is behind the `ValueFoundation` trait, and
  # the default set holds the value and the coder to FoundationEssentials. The tests run once per
  # row, under the set that brings the bridge and the tests of it back in; the shipping build
  # keeps the default set, which is also the check that the value and the coder compile against
  # FoundationEssentials alone, with no `import Foundation` left to bring ICU in. That the tests
  # still compile under the default set, with the bridge tests behind their `#if`, is a build
  # below. Darwin compiles the bridge whatever the traits say, so its rows add nothing.
  #
  # The targets, and why each is here:
  #
  # - Linux is where reading a number out of an `Any` takes the other branch: matching what
  #   `NSNumber._swiftValueOfOptimalType` hands back rather than asking CoreFoundation, where
  #   `propertyList` narrowing `Int64` to `Int` produces a different type rather than the same
  #   `NSNumber`. The arm64 row exercises that branch on both server architectures.
  # - Windows is the other non-Darwin Foundation, built from the same corelibs over a different
  #   C library.
  # - Linux musl cross-compiles through the static SDK and builds only: the SDK ships no testing
  #   library.
  # - WebAssembly wasip1 is the single-threaded flavor, on which the process-spawning
  #   precondition tests are compiled out; the rest run through WasmKit.
  # - Android API 28 is the one Foundation here built against bionic, and runs its tests on the
  #   emulator. The arm64 row is built only; nothing hosted can run it.
  swift:
    uses: sinoru/github-workflows/.github/workflows/swift.yml@main
    with:
      swift: '["6.3", "6.4"]'
      configurations: '["Debug", "Release"]'
      test-arguments: --disable-xctest
      targets: |
        [
          "arm64-apple-macosx",
          { "triple": "x86_64-unknown-linux-gnu", "test_arguments": "--traits ValueCoder,ValueFoundation" },
          { "triple": "aarch64-unknown-linux-gnu", "test_arguments": "--traits ValueCoder,ValueFoundation" },
          { "triple": "x86_64-unknown-windows-msvc", "test_arguments": "--traits ValueCoder,ValueFoundation" },
          { "triple": "aarch64-unknown-windows-msvc", "test_arguments": "--traits ValueCoder,ValueFoundation" },
          "x86_64-swift-linux-musl",
          { "triple": "wasm32-unknown-wasip1", "test_arguments": "--traits ValueCoder,ValueFoundation" },
          { "triple": "x86_64-unknown-linux-android28", "test_arguments": "--traits ValueCoder,ValueFoundation" },
          "aarch64-unknown-linux-android28"
        ]

  # The trait set is part of the package's public interface, so every configuration a consumer
  # can ask for has to keep compiling. `Value` is the one the README advertises, a consumer that
  # only reads a property list and wants none of the coder; disabling both leaves the umbrella
  # with nothing to re-export, which is the configuration that would break first if a target
  # ever imported a sibling unconditionally. `--target` is what makes either mean anything: a
  # trait decides what `PropertyList` depends on, not what the package contains, and a bare
  # `swift build` compiles every target regardless. The Foundation set is the one the rows
  # above test under, and is built here too for the rows that do not test, musl and arm64
  # Android, where this is the one place the bridge compiles at all. The last build is the
  # tests under the default trait set, so that a bridge test added without its `#if` fails
  # here rather than on a bare `swift test` on Linux.
  builds:
    uses: sinoru/github-workflows/.github/workflows/builds.yml@main
    with:
      swift: '["6.3", "6.4"]'
      targets: |
        [
          "arm64-apple-macosx",
          "x86_64-unknown-linux-gnu",
          "aarch64-unknown-linux-gnu",
          "x86_64-unknown-windows-msvc",
          "aarch64-unknown-windows-msvc",
          "x86_64-swift-linux-musl",
          "wasm32-unknown-wasip1",
          "x86_64-unknown-linux-android28",
          "aarch64-unknown-linux-android28"
        ]
      builds: |
        [
          "--target PropertyList --traits Value",
          "--target PropertyList --traits ValueCoder,ValueFoundation",
          "--target PropertyList --disable-default-traits",
          "--build-tests"
        ]

  benchmarks-matrix:
    uses: sinoru/github-workflows/.github/workflows/matrix.yml@main
    with:
      swift: '["6.3", "6.4"]'
      targets: '["arm64-apple-macosx", "x86_64-unknown-linux-gnu"]'

  # The benchmarks, on one runner of each kind: reading an `Any` takes one path on Darwin and
  # another away from it, so these two cover every path. They measure the library as it ships,
  # built by the benchmark package's own manifest against the checkout above it, and put the
  # table in the job's summary. Nothing fails on a number: a shared runner is noisy, and what
  # the numbers are for is reading. `pipefail`, so that a benchmark that crashes fails the step
  # through the tee.
  benchmarks:
    needs: benchmarks-matrix
    name: Benchmarks · ${{ matrix.os }} · Swift ${{ matrix.swift }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.benchmarks-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: sinoru/github-workflows/actions/setup-swift@main
        with:
          version: ${{ matrix.patch }}
          developer-dir: ${{ matrix.developer_dir }}

      - name: Run benchmarks
        working-directory: Benchmarks
        run: |
          set -o pipefail
          swift package benchmark --format markdown --no-progress --grouping metric | tee "$RUNNER_TEMP/benchmarks.md"
          sed -n '/^## Baseline/,$p' "$RUNNER_TEMP/benchmarks.md" >> "$GITHUB_STEP_SUMMARY"
